<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finn Woo</title>
<meta name="description" content="Finn Woo — design and app projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,'Segoe UI',sans-serif;background:#fff;color:#1c1c22;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px}
main{max-width:520px;width:100%}
h1{font-size:44px;font-weight:600;letter-spacing:-1.2px;line-height:1.05}
.sub{color:#6f6f88;font-size:17px;margin-top:10px}
.note{display:inline-block;margin-top:26px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#6f6f88;border:1px solid #e6e5ec;border-radius:20px;padding:6px 14px}
.proj{margin-top:34px;border-top:1px solid #e6e5ec;padding-top:22px}
.proj small{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#6f6f88;margin-bottom:8px}
.proj b{font-size:22px;font-weight:500;color:#46476C}.proj b i{font-style:normal;color:#F47B36}
.proj p{color:#6f6f88;font-size:15px;margin-top:4px;line-height:1.6}
.links{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
a{color:#F47B36;font-weight:600;font-size:14px;text-decoration:none}a:hover{text-decoration:underline}
@media(max-width:480px){h1{font-size:36px}}
</style>
</head>
<body>
<main>
  <h1>Finn Woo</h1>
  <p class="sub">Design &amp; app projects</p>
  <span class="note">Portfolio coming soon</span>
  <div class="proj">
    <small>App</small>
    <b>my<i>Dish</i></b>
    <p>Scan a menu, see what every dish tastes like, and hear how to say it.</p>
    <div class="links"><a href="mydish/support.html">Support</a><a href="mydish/privacy.html">Privacy Policy</a></div>
  </div>
</main>
</body>
</html>
